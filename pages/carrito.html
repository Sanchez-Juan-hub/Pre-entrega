<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

        <!-- Enlace a styles en la carpeta css/ -->
        <link rel="stylesheet" href="../css/styles.css" />
        <title>Carrito</title>
    </head>

    <body>
        <header>
            <div class="div-logo"><a class="logo" href="../index.html">CHOCOLATES PREMIUM</a></div>

            <nav class="header-nav">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="./contacto.html">Contacto</a></li>
                    <li><a href="./carrito.html">Carrito <span id="contador-carrito"></span></a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h1 class="titulo">Carrito de Compras</h1>
                <div class="carrito-layout">
                <!-- Columna izquierda: productos -->
                    <section class="carrito-productos">
                        <div class="carrito-encabezado">
                            <span>Producto</span>
                            <span></span>
                            <span>Precio</span>
                            <span>Cant.</span>
                            <span>Subtotal</span>
                            <span></span>
                        </div>

                        <!-- Aqui el JS renderiza las filas de productos -->
                        <div id="contenedor-carrito"></div>
                        
                        <!-- Aqui el JS agrega el boton vaciar carrito -->
                        <div id="acciones-carrito" class="acciones-carrito"></div>
                    </section>

                    <!-- Columna derecha: resumen (lo completa el JS) -->
                    <aside id="resumen-carrito" class="carrito-resumen"></aside>
                    </div>
            </section>
        </main>

        <footer>
            <p>© 2026 Tienda de Chocolates Premium. Todos los derechos reservados.</p>
            <nav>
                <ul class="footer-list">
                    <li><img src="../img/socialmedia/whatsapp-logo.png" alt="logo-whatsapp" /></li>
                    <li><img src="../img/socialmedia/instagram-logo.png" alt="logo-instagram" /></li>
                    <li><img src="../img/socialmedia/facebook-logo.png" alt="logo-facebook" /></li>
                </ul>
            </nav>
        </footer>
        <!-- Este script agrega el enlace al carrito.js y muy importante el type=module para trabajar en modulos -->
        <script src="../js/carrito.js" type="module"></script>
    </body>
</html>
